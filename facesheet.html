<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>电子面单</title>
<style>
@media print { @page { size:75.14mm 129.12mm; margin:0; } body { margin:0; } .toolbar { display:none !important; } .abs { -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; } }
@media screen { body { background:#eee; } .page { margin:20px auto; box-shadow:0 2px 8px rgba(0,0,0,.3); } }
* { margin:0; padding:0; box-sizing:border-box; }
.toolbar { position:fixed; top:0; left:0; right:0; z-index:99; background:#fff; padding:8px 16px; border-bottom:1px solid #ccc; display:flex; gap:12px; align-items:center; justify-content:flex-end; }
.page { position:relative; width:75.14mm; height:129.12mm; background:#fff; overflow:hidden; }
.frame { position:absolute; left:0; top:0; width:75.14mm; height:129.12mm; }
.abs { position:absolute; }
.dtxt { font-family:"Microsoft YaHei","SimHei",sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ctxt { font-family:"Microsoft YaHei","SimHei",sans-serif; white-space:nowrap; }
.wtxt { font-family:"Microsoft YaHei","SimHei",sans-serif; word-break:break-all; overflow:hidden; }
.vtext { writing-mode:vertical-rl; transform:rotate(180deg); font-family:Arial,sans-serif; white-space:nowrap; letter-spacing:0.2mm; }
</style>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨 打印面单</button>
</div>
<div class="page" id="page">
  <div class="frame">
<!-- ===== 结构线条（按PDF精确坐标） ===== -->
<div class="abs" style="left:5.1mm; top:12.0mm; width:65.0mm; height:0.5mm; background:#000;"></div>
<div class="abs" style="left:5.1mm; top:21.0mm; width:65.0mm; height:0.5mm; background:#000;"></div>
<div class="abs" style="left:5.1mm; top:37.0mm; width:52.9mm; height:0.5mm; background:#000;"></div>
<div class="abs" style="left:5.1mm; top:43.6mm; width:52.9mm; height:0.5mm; background:#000;"></div>
<div class="abs" style="left:5.1mm; top:48.7mm; width:52.9mm; height:0.5mm; background:#000;"></div>
<div class="abs" style="left:5.1mm; top:69.0mm; width:53.0mm; height:0.5mm; background:#000;"></div>
<div class="abs" style="left:5.1mm; top:79.0mm; width:65.2mm; height:0.5mm; background:#000;"></div>
<div class="abs" style="left:58.0mm; top:21.1mm; width:0.5mm; height:57.9mm; background:#000;"></div>
<!-- 集包地黑色方块 -->
<div class="abs" style="left:5.7mm; top:37.0mm; width:6.9mm; height:6.1mm; background:#000;"></div>

<!-- ===== 横向条码 ===== -->
<canvas id="barcodeH" class="abs" style="left:5.7mm; top:22.0mm; width:50.7mm; height:10.9mm;"></canvas>

<!-- ===== 横条码下方运单号 ===== -->
<div class="abs dtxt" id="el_mailno_barcode" style="left:5.7mm; top:33.0mm; font-size:10pt; font-family:Arial; width:50.7mm; text-align:center;"></div>

<!-- ===== 竖向条码（竖线右侧区域，缩短避免截断） ===== -->
<canvas id="barcodeV" class="abs" style="left:59.0mm; top:24.0mm; width:10.9mm; height:48.0mm;"></canvas>

<!-- ===== 运单号（顶部区域 0-12mm） ===== -->
<div class="abs dtxt" id="el_mailno_top" style="left:1.3mm; top:5.4mm; font-size:8pt; font-family:Arial;"></div>
<div class="abs dtxt" id="el_date" style="left:1.0mm; top:8.8mm; font-size:7pt; font-family:Arial;"></div>
<div class="abs dtxt" id="el_time" style="left:20.1mm; top:9.0mm; font-size:7pt; font-family:Arial;"></div>
<div class="abs dtxt" id="el_pageno" style="left:32.8mm; top:9.0mm; font-size:7pt;"></div>

<!-- ===== 大头笔区域（12-21mm上方 → 33-43mm） ===== -->
<div class="abs dtxt" id="el_printKey" style="left:8.5mm; top:13.0mm; font-size:20pt; font-weight:bold; max-width:60mm; overflow:hidden;"></div>

<!-- ===== 集包地区域（37-43.6mm） ===== -->
<div class="abs" id="el_dest2" style="left:6.2mm; top:37.5mm; width:5.8mm; height:5.1mm; color:#fff; font-size:13pt; font-weight:bold; font-family:'Microsoft YaHei',sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; line-height:5.1mm;"></div>
<div class="abs dtxt" id="el_pkgName" style="left:13.5mm; top:38.0mm; font-size:10pt; font-weight:bold; max-width:43mm;"></div>

<!-- ===== 收件人区域（48.7-69mm） ===== -->
<div class="abs" style="left:5.5mm; top:49.4mm; width:3.5mm; height:3.5mm; border:0.5mm solid #000; font-size:6pt; font-family:'Microsoft YaHei',sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; line-height:3.5mm;">收</div>
<div class="abs dtxt" id="el_rname" style="left:9.6mm; top:50.0mm; font-size:10pt; font-weight:normal; max-width:47mm;"></div>
<div class="abs wtxt" id="el_raddr" style="left:9.6mm; top:54.0mm; font-size:10pt; font-weight:normal; max-width:47mm; max-height:14mm; line-height:1.3; overflow:hidden;"></div>

<!-- ===== 寄件人区域（69-79mm） ===== -->
<div class="abs" style="left:5.5mm; top:69.7mm; width:3.5mm; height:3.5mm; border:0.5mm solid #000; font-size:6pt; font-family:'Microsoft YaHei',sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; line-height:3.5mm;">寄</div>
<div class="abs dtxt" id="el_sname" style="left:9.6mm; top:70.0mm; font-size:7.5pt; font-weight:normal; max-width:47mm;"></div>
<div class="abs wtxt" id="el_saddr" style="left:9.6mm; top:73.0mm; font-size:7.5pt; font-weight:normal; max-width:47mm; max-height:6mm; line-height:1.2; overflow:hidden;"></div>

<!-- ===== 商品信息区域（79mm以下） ===== -->
<div class="abs dtxt" id="el_pono" style="left:0.8mm; top:80.0mm; font-size:8pt; font-weight:bold;"></div>
<div id="el_items" class="abs" style="left:0.8mm; top:83.5mm; width:70mm; font-size:8pt;"></div>
<div class="abs ctxt" id="el_total" style="left:50.0mm; top:103.6mm; font-size:8pt; font-weight:bold;"></div>
<div class="abs ctxt" id="el_totaln" style="left:57.0mm; top:103.6mm; font-size:8pt; font-weight:bold;"></div>
<div class="abs ctxt" id="el_checked" style="left:62.0mm; top:103.6mm; font-size:7pt;">已验视</div>

<!-- ===== 侧面竖向运单号 ===== -->
<div class="abs vtext" style="left:1.3mm; top:17.9mm; font-size:7.5pt; transform:rotate(0deg);" id="sideL1"></div>
<div class="abs vtext" style="left:1.5mm; top:52.4mm; font-size:7.5pt; transform:rotate(0deg);" id="sideL2"></div>
<div class="abs vtext" style="left:71.3mm; top:17.9mm; font-size:7.5pt;" id="sideR1"></div>
<div class="abs vtext" style="left:71.3mm; top:51.9mm; font-size:7.5pt;" id="sideR2"></div>

  </div>
</div>
<script>
/* ========== Canvas DPI缩放 ========== */
function setupCanvas(id, wMM, hMM) {
  const c = document.getElementById(id);
  if (!c) return;
  const dpr = window.devicePixelRatio || 1;
  const scale = 96 / 25.4;
  c.width = Math.round(wMM * scale * dpr);
  c.height = Math.round(hMM * scale * dpr);
  c.style.width = wMM + 'mm';
  c.style.height = hMM + 'mm';
}

/* ========== 横向条码 ========== */
function drawH(canvas, text) {
  if (!text || !canvas) return;
  try {
    JsBarcode(canvas, text, {
      format: "CODE128",
      width: 1.5, height: 80,
      displayValue: false,
      margin: 0
    });
  } catch(e) { console.warn('drawH error', e); }
}

/* ========== 竖向条码 ========== */
function drawV(canvas, text) {
  if (!text || !canvas) return;
  // 先画到临时canvas（横向），再旋转90度画到目标
  var tmp = document.createElement('canvas');
  try {
    JsBarcode(tmp, text, {
      format: "CODE128",
      width: 2, height: 100,
      displayValue: false,
      margin: 0
    });
  } catch(e) { console.warn('drawV error', e); return; }
  // 旋转
  var ctx = canvas.getContext('2d');
  canvas.width = tmp.height;
  canvas.height = tmp.width;
  ctx.translate(canvas.width, 0);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(tmp, 0, 0);
}

/* ========== 数据填充 ========== */
function loadFacesheetData(d) {
  if (!d) return;
  var mailNo = d.mailNo || '';
  var dateStr = d.date || '';
  var timeStr = d.time || '';
  if (!dateStr) {
    var now = new Date();
    dateStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0');
    timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  }

  // 运单号
  setText('el_mailno_top', mailNo);
  setText('el_date', dateStr);
  setText('el_time', timeStr);
  setText('el_pageno', '第1/1个');

  // 大头笔 = 三段码（seg/shortAddr），不是公司名
  var seg = d.seg || d.shortAddress || d.printKey || '';
  setText('el_printKey', seg);

  // 横条码下方运单号
  setText('el_mailno_barcode', mailNo);

  // 集包地（"末"字 + 公司名）
  setText('el_dest2', d.dest2 || '末');
  var pkgName = d.landmark || d.dest || d.packageCenterName || '';
  setText('el_pkgName', pkgName);

  // 收件人（退货场景：收件人=供应商）
  var recv = d.receiver || {};
  var rName = recv.name || d.receiverName || '';
  var rPhone = recv.phone || d.receiverPhone || '';
  var addrLines = recv.addressLines || [];
  var rAddrStr = addrLines.join('') || ((d.receiverCity||'') + (d.receiverDistrict||'') + (d.receiverAddress||''));
  setText('el_rname', [rName, rPhone].filter(Boolean).join(' '));
  setText('el_raddr', rAddrStr);

  // 寄件人
  var sndr = d.sender || {};
  var sName = sndr.name || d.senderName || '';
  var sPhone = sndr.phone || d.senderPhone || '';
  var sAddr = sndr.address || ((d.senderProvince||'') + (d.senderCity||'') + (d.senderDistrict||'') + (d.senderAddress||''));
  setText('el_sname', [sName, sPhone].filter(Boolean).join(' '));
  setText('el_saddr', sAddr);

  // 商品信息
  setText('el_pono', '采购单号：' + (d.poId || d.poNo || ''));
  var items = d.rows || d.items || [];
  var totalQty = d.totalQty || 0;
  var itemsHtml = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var qty = parseInt(it.qty) || 1;
    if (!totalQty) totalQty += qty;
    var sku = it.style || it.sku || '';
    var color = it.color || '';
    var size = it.size || '';
    var spec = it.spec || [color, size].filter(Boolean).join(';');
    var loc = it.loc || it.location || '';
    itemsHtml += '<div style="font-size:8pt; line-height:1.3;">' + sku + ' ' + spec + '*' + qty + '件 ' + (loc ? '(' + loc + ') ' : '') + '</div>';
  }
  if (!totalQty) totalQty = parseInt(d.qty) || 1;
  document.getElementById('el_items').innerHTML = itemsHtml;
  setText('el_total', '合计');
  setText('el_totaln', totalQty + '');

  // 侧面竖向运单号
  setText('sideL1', mailNo);
  setText('sideL2', mailNo);
  setText('sideR1', mailNo);
  setText('sideR2', mailNo);

  // 条码
  setupCanvas("barcodeH", 50.70, 10.90);
  drawH(document.getElementById("barcodeH"), mailNo);
  setupCanvas("barcodeV", 10.90, 48.00);
  drawV(document.getElementById("barcodeV"), mailNo);
}

function setText(id, val) {
  var el = document.getElementById(id);
  if (el) el.textContent = val || '';
}

/* ========== 父窗口推送入口 ========== */
window.loadFacesheetData = loadFacesheetData;

/* ========== URL参数兜底 ========== */
(function() {
  var params = new URLSearchParams(location.search);
  var dataStr = params.get('data');
  if (dataStr) {
    try { loadFacesheetData(JSON.parse(decodeURIComponent(dataStr))); } catch(e) {}
  }
})();
</script>
</body>
</html>
